name: Run Symbolize Tests
description: Runs unit and integration tests for starboard/tools/symbolize

runs:
  using: "composite"
  steps:
    - name: Run Symbolize Tests
      shell: bash
      run: |
        set -x
        if [[ -f "cobalt/src/starboard/tools/symbolize/symbolize_test.py" ]]; then
          python3 cobalt/src/starboard/tools/symbolize/symbolize_test.py -v
        elif [[ -f "starboard/tools/symbolize/symbolize_test.py" ]]; then
          python3 starboard/tools/symbolize/symbolize_test.py -v
        else
          echo "symbolize_test.py not found!" >&2
          exit 1
        fi
