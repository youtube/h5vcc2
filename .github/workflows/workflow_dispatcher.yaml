# Disable dangerous-triggers rule because this workflow uses pull_request_target
# strictly to rerun existing workflows when trigger labels are applied,
# without checking out or executing untrusted code from PR branches.
# actionlint: disable dangerous-triggers
name: Workflow Dispatcher

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true
      label_name:
        description: 'Label name'
        required: true
        default: 'runtest'

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'runtest' || github.event.label.name == 'yts_playback_test' || github.event.label.name == 'kokoro:run' || github.event.label.name == 'kokoro:force-run'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Check label and trigger PR jobs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let pr = context.payload.pull_request;
            let labelName = context.payload.label ? context.payload.label.name : null;

            if (context.eventName === 'workflow_dispatch') {
              const prNumber = parseInt(context.payload.inputs.pr_number, 10);
              labelName = context.payload.inputs.label_name;
              const prResponse = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              pr = prResponse.data;
            }

            const runsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: pr.head.sha,
              event: 'pull_request'
            });

            const targetPatterns = (labelName === 'kokoro:run' || labelName === 'kokoro:force-run')
              ? ['tvos']
              : ['android', 'aosp', 'evergreen', 'linux', 'tvos', 'raspi', 'gradle', 'pytest', 'stub', 'win32', 'xb1'];

            const targetRuns = runsResponse.data.workflow_runs.filter(run =>
              targetPatterns.some(pattern => run.path.includes(pattern))
            );

            console.log(`Triggering workflows for label ${labelName}:`, targetRuns.map(r => `${r.name} (${r.path})`));

            await Promise.all(targetRuns.map(async (latestRun) => {
              try {
                // If the workflow is currently running or queued, cancel it first so it can be re-run
                if (latestRun.status !== 'completed') {
                  console.log(`Run ${latestRun.id} for ${latestRun.name} (${latestRun.path}) is currently ${latestRun.status}. Cancelling...`);
                  try {
                    await github.rest.actions.cancelWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: latestRun.id
                    });
                  } catch (cancelError) {
                    console.log(`Cancel request note for ${latestRun.name} (${latestRun.path}):`, cancelError.message);
                  }

                  // Wait for run to reach 'completed' status before attempting to rerun
                  for (let attempt = 0; attempt < 15; attempt++) {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    const checkRun = await github.rest.actions.getWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: latestRun.id
                    });
                    if (checkRun.data.status === 'completed') {
                      console.log(`Run ${latestRun.id} for ${latestRun.name} reached completed status (${checkRun.data.conclusion}).`);
                      break;
                    }
                  }
                }

                console.log(`Rerunning ${latestRun.name} (${latestRun.path}) (run ${latestRun.id})...`);
                await github.rest.actions.reRunWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: latestRun.id
                });
                console.log(`Successfully triggered rerun for ${latestRun.name} (${latestRun.path}) (run ${latestRun.id})!`);
              } catch (error) {
                console.error(`Failed to rerun ${latestRun.name} (${latestRun.path}):`, error);
              }
            }));

            // Remove the trigger label after all workflows have been triggered
            if (labelName === 'runtest' || labelName === 'yts_playback_test') {
              try {
                console.log(`Removing label ${labelName} from PR #${pr.number}...`);
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: labelName
                });
                console.log(`Successfully removed label ${labelName} from PR #${pr.number}.`);
              } catch (error) {
                console.error(`Failed to remove label ${labelName}:`, error);
              }
            }
