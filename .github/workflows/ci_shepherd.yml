# Disable dangerous-triggers rule because this workflow uses workflow_run
# strictly to deflake tests and generate reports, without checking out
# or executing untrusted code from PR branches.
# actionlint: disable dangerous-triggers
name: CI Shepherd

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [android, aosp, evergreen, linux, tvos]
    types:
      - in_progress
      - completed

permissions:
  contents: read

jobs:
  deflake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      rerun_triggered: ${{ steps.rerun.outputs.rerun_triggered || 'false' }}
    steps:
      - name: Checkout
        if: github.event.workflow_run.conclusion == 'failure'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github

      - name: Rerun Failing Tests
        id: rerun
        if: github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          # Max number of times the tests should run.
          MAX_ATTEMPTS=3
          if [[ -f .github/config/infra/deflake.json ]]; then
            MAX_ATTEMPTS=$(jq -r '.deflake_runs | tonumber? // 3' .github/config/infra/deflake.json)
          fi

          # This call fails until the workflow has run $MAX_ATTEMPTS times.
          if gh run view --repo "${REPO}" "${WORKFLOW}" --attempt "${MAX_ATTEMPTS}" 2>/dev/null; then
            echo "Done retrying ${WORKFLOW_NAME}. It is still failing after ${MAX_ATTEMPTS} attempts."
            echo "rerun_triggered=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Check if there are failing _tests jobs to rerun.
          failed_tests=$(gh run view --repo "${REPO}" "${WORKFLOW}" --json jobs --jq '[.jobs[] | select(.conclusion=="failure") | select(.name | contains("_tests"))] | length')

          if [[ "${failed_tests}" -eq 0 ]]; then
            echo "No failing '_tests' jobs found to rerun."
            echo "rerun_triggered=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Rerun all failed jobs under the workflow all in one go.
          echo "Rerunning failed jobs under https://github.com/${REPO}/actions/runs/${WORKFLOW}"
          gh run rerun --repo "${REPO}" "${WORKFLOW}" --failed
          echo "rerun_triggered=true" >> "${GITHUB_OUTPUT}"

          # Sleep to allow GitHub API to transition the run status to in_progress/queued
          sleep 5

  update-status:
    runs-on: ubuntu-latest
    needs: deflake
    if: always() && !cancelled()
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: read
      actions: read
    outputs:
      pr_number: ${{ steps.update-status.outputs.pr_number }}
    steps:
      - name: Update Triggering Workflow Commit Status
        id: update-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW: ${{ github.event.workflow_run.id }}
          STATUS: ${{ github.event.workflow_run.status || 'none' }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || 'null' }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || 1 }}
        shell: bash
        run: |
          set -euo pipefail

          # Query live workflow run status from the API to handle out-of-order/delayed event delivery.
          live_run=$(gh run view --repo "${REPO}" "${WORKFLOW}" --json status,conclusion,attempt 2>/dev/null || true)
          if [[ -n "${live_run}" ]]; then
            live_status=$(echo "${live_run}" | jq -r '.status // empty')
            live_conclusion=$(echo "${live_run}" | jq -r '.conclusion // empty')
            live_attempt=$(echo "${live_run}" | jq -r '.attempt // empty')
            if [[ -n "${live_status}" ]]; then
              STATUS="${live_status}"
              CONCLUSION="${live_conclusion:-null}"
            fi
            if [[ -n "${live_attempt}" ]]; then
              RUN_ATTEMPT="${live_attempt}"
            fi
          fi

          running_statuses=("in_progress" "queued" "requested" "waiting" "pending")
          if [[ " ${running_statuses[*]} " == *" ${STATUS} "* ]] || [[ "${CONCLUSION}" == "null" || -z "${CONCLUSION}" ]]; then
            state="pending"
            desc="Checks are running"
            if [[ "${RUN_ATTEMPT}" -gt 1 ]]; then
              desc="Retrying failed jobs"
            fi
          elif [[ "${CONCLUSION}" == "success" ]]; then
            state="success"
            desc="Passed"
          else
            state="failure"
            desc="Failed"
          fi

          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f target_url="${RUN_URL}" \
            -f description="${desc}" \
            -f context="CI / ${WORKFLOW_NAME}"

          pr_number=$(gh pr list --repo "${REPO}" --search "${HEAD_SHA}" --json number --jq '.[0].number // ""')
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"

          # Query commit statuses and update overall CI commit status (CI / All Pass) for rulesets.
          status_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" 2>/dev/null || echo "{}")
          IFS=$'\t' read -r overall_state overall_desc < <(echo "${status_json}" | jq -r '
            [.statuses[]? | select(.context | startswith("CI /")?) | select(.context != "CI / All Pass")] |
            if any(.state == "failure" or .state == "error") then "failure\tSome checks failed"
            elif length > 0 and all(.state == "success") then "success\tAll checks passed"
            else "pending\tChecks are running" end
          ') || true

          all_pass_url="https://github.com/${REPO}/commit/${HEAD_SHA}"
          if [[ -n "${pr_number}" ]]; then
            all_pass_url="https://github.com/${REPO}/pull/${pr_number}"
          fi

          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="${overall_state:-pending}" \
            -f target_url="${all_pass_url}" \
            -f description="${overall_desc:-Checks are running}" \
            -f context="CI / All Pass"

  comment-pr:
    runs-on: ubuntu-latest
    needs: update-status
    if: always() && needs.update-status.outputs.pr_number != '' && !cancelled()
    timeout-minutes: 5
    permissions:
      statuses: read
      pull-requests: write
    concurrency:
      # Serialize sticky comment updates per PR so concurrent workflow runs do not race to create duplicate comments.
      group: ${{ github.workflow }}-comment @ ${{ needs.update-status.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Generate Shepherd Report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          status_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status")

          # Generate a temporary report from the commit statuses.
          # TODO: Generate a richer report using the shepherd json report.
          echo "${status_json}" | jq -r '
            {success: "✅ PASS", pending: "⏳ PENDING"} as $icons |
            ["| Context | State | Description |", "|---|---|---|"] +
            [
              .statuses // [] | sort_by(.context)[] | select(.context | startswith("CI /")?) |
              "| [\(.context)](\(.target_url // "")) | \($icons[.state] // "❌ FAIL") | \(.description // "") |"
            ] | join("\n")
          ' > shepherd_report.md

      - name: Comment on PR
        if: always() && steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.update-status.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${PR_NUMBER}"
          header="<!-- sticky-pull-request-comment: shepherd-report -->"
          report_content=$(cat shepherd_report.md)
          comment_body="${header}"$'\n'"${report_content}"

          # Check for existing comment with header across all pages (--paginate) safely
          comments_json=$(gh api --paginate "repos/${REPO}/issues/${pr_number}/comments" 2>/dev/null || true)
          existing_comment_id=$(printf '%s\n' "${comments_json}" | jq -s -r --arg h "${header}" '[.[][]? | objects | select((.body // "") | contains($h))] | .[0].id // empty' 2>/dev/null || true)

          # Construct valid JSON payload safely via jq
          json_payload=$(jq -n --arg b "${comment_body}" '{body: $b}')

          if [[ -n "${existing_comment_id}" ]]; then
            echo "Updating existing sticky PR comment ${existing_comment_id} on PR #${pr_number}"
            echo "${json_payload}" | gh api -X PATCH "repos/${REPO}/issues/comments/${existing_comment_id}" --input - --silent
          else
            echo "Creating new sticky PR comment on PR #${pr_number}"
            echo "${json_payload}" | gh api -X POST "repos/${REPO}/issues/${pr_number}/comments" --input - --silent
          fi
